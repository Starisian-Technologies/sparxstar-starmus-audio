# Security Checks Workflow
# Purpose: Monitor production dependencies for security issues
# Note: Audit steps use continue-on-error so findings in third-party/unfixable
#       dependencies are surfaced in the log without blocking the workflow run.
name: Security Checks

on:
  schedule:
    - cron: '0 0 * * 0' # every Sunday at midnight UTC
  workflow_dispatch: # allow manual runs

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Composer security audit (production only)
        # continue-on-error: vulnerabilities in third-party/transitive deps cannot always
        # be resolved by this project; findings remain visible in the job log.
        continue-on-error: true
        run: |
          echo "🔍 Checking production PHP dependencies for security issues..."
          composer audit --no-dev --format=table

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        # uses: pnpm/action-setup@v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile --prod

      - name: pnpm security audit (production only)
        # continue-on-error: same rationale as Composer audit above.
        continue-on-error: true
        run: |
          echo "🔍 Checking production Node.js dependencies for security issues..."
          pnpm audit --audit-level=moderate --prod
